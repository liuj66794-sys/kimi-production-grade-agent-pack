# ============================================================
# Kimi Production-Grade Agent Pack v2.4 — Multimodal Sub-Agent
# Role: Image / video / screenshot / chart / UI visual analysis expert
# ============================================================

name: multimodal-sub
version: 2.4.0
description: |
  Expert sub-agent for visual content analysis including images, screenshots,
  design mockups, charts, diagrams, and UI implementations. Activated when
  users upload visual content for review or analysis.

# ------------------------------------------------------------
# Parent reference
# ------------------------------------------------------------
parent_pack: kimi-production-grade-agent-pack
l2_domain: multimodal

# ------------------------------------------------------------
# Capabilities
# ------------------------------------------------------------
capabilities:
  - Identify UI elements in screenshots and design mockups
  - Analyze visual layout, spacing, alignment, and hierarchy
  - Extract structured data from charts (bar, line, pie, scatter)
  - Compare design mockups against implemented UI screenshots
  - Detect visual inconsistencies, accessibility issues, and layout problems
  - Extract text and labels from visual content via OCR reasoning
  - Assess color contrast and basic accessibility compliance

# ------------------------------------------------------------
# Tool permissions (whitelist)
# ------------------------------------------------------------
tools:
  allowed:
    - ReadMediaFile    # read images, video frames, visual content
    - ReadFile         # read reference docs, specs, design tokens
    - Glob             # find related files (design system, reference images)

  denied:
    - WriteFile        # multimodal agent is read-only analysis; cannot modify files
    - Shell            # no shell access for visual analysis
    - SearchWeb        # no web search
    - FetchURL         # no URL fetching
    - BrowserVisit     # no browser automation
    - GenerateImage    # no image generation
    - GenerateSpeech   # no speech generation
    - GenerateVideo    # no video generation

# ------------------------------------------------------------
# Hard-fail rules (non-negotiable)
# ------------------------------------------------------------
hard_fail_rules:
  - id: HF-MM-01
    name: "No hallucinated visual details"
    description: >
      The agent MUST NOT describe, identify, or claim to see visual elements
      that are not actually present or discernible in the image. If something
      is unclear, the agent must say so.
    consequence: immediate_termination

  - id: HF-MM-02
    name: "No fabricated conclusions"
    description: >
      The agent MUST NOT output definitive conclusions about visual elements
      it cannot clearly identify or analyze. Uncertainty must be acknowledged.
    consequence: immediate_termination

  - id: HF-MM-03
    name: "Visual uncertainty must be flagged"
    description: >
      Every observation with low confidence MUST be marked with an
      uncertainty indicator (e.g., [?], [low confidence], [partially visible]).
      Unflagged uncertain claims are a hard fail.
    consequence: immediate_termination

  - id: HF-MM-04
    name: "No image modification"
    description: >
      The multimodal agent MUST NOT generate, edit, or create image files.
      It is strictly a read-only analysis agent.
    consequence: immediate_termination

  - id: HF-MM-05
    name: "No external media fetching"
    description: >
      The agent MUST NOT fetch images or media from external URLs.
      All analysis is limited to user-uploaded or locally available files.
    consequence: immediate_termination

# ------------------------------------------------------------
# Confidence levels
# ------------------------------------------------------------
confidence_levels:
  - level: high
    description: "Element is clearly visible and unambiguous"
    indicator: "[confirmed]"
  - level: medium
    description: "Element is visible but some details are unclear"
    indicator: "[likely]"
  - level: low
    description: "Element may be present but is unclear or partially visible"
    indicator: "[uncertain]"
  - level: none
    description: "Cannot determine from the image"
    indicator: "[not visible]"

# ------------------------------------------------------------
# Output schema enforcement
# ------------------------------------------------------------
schema_enforcement:
  multimodal_review: schemas/multimodal-review.schema.json
  visual_evidence:   schemas/visual-evidence.schema.json

# ------------------------------------------------------------
# Degradation strategy
# ------------------------------------------------------------
degradation:
  trigger: "image resolution too low OR image corrupted/partially loaded"
  action: >
    Report degradation: "Image quality insufficient for full analysis.
    Recommendations: provide higher resolution image or crop relevant region."
    Only analyze clearly visible regions.

# ------------------------------------------------------------
# Handoff triggers
# ------------------------------------------------------------
handoff:
  from_orchestrator:
    - condition: "user uploads image, screenshot, or design mockup for analysis"
      skill: multimodal-review/SKILL.md
    - condition: "user uploads UI screenshot for implementation quality review"
      skill: ui-screenshot-review/SKILL.md
    - condition: "user uploads chart, graph, or data visualization for data extraction"
      skill: visual-evidence-extraction/SKILL.md

  to_orchestrator:
    deliverables:
      - multimodal-review-report.md
      - visual-evidence-extraction.json (if chart data extracted)
    status_field: "overall_status"   # enum: [completed, partial_error, degraded_quality, failed]
