name: Eval Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      suite:
        description: 'Eval suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - unit-smoke
          - integration-smoke
      model:
        description: 'Model to use'
        required: true
        default: 'kimi-latest'
        type: string

jobs:
  smoke_eval:
    name: Run Smoke Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema || true

      - name: Validate schemas
        run: |
          python scripts/validate_schema.py --check-schemas

      - name: Run Smoke Eval
        env:
          MODEL_NAME: ${{ github.event.inputs.model || 'kimi-latest' }}
          SUITE: ${{ github.event.inputs.suite || 'smoke' }}
        run: |
          python scripts/eval_runner.py \
            --suite "$SUITE" \
            --output "evals/results/${{ github.ref_name }}" \
            --model "$MODEL_NAME"

      - name: Check Hard Fail
        run: |
          python scripts/check_hard_fail.py \
            --input "evals/results/${{ github.ref_name }}" \
            --threshold 0.8

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/${{ github.ref_name }}/eval-result.json
            evals/results/${{ github.ref_name }}/raw-output.md
            evals/results/${{ github.ref_name }}/errors.jsonl
            evals/results/${{ github.ref_name }}/run-metadata.json
            evals/results/${{ github.ref_name }}/debug.log
          retention-days: 30

      - name: Report status
        if: always()
        run: |
          echo "Eval pipeline completed"
          echo "Results available in artifact: eval-results-${{ github.run_id }}"
